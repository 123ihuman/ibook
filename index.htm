<style>
/* ============================================================
   THEME TOKENS
   ============================================================ */
:root{
  --bg:#0a0a0c; --bg-2:#101013; --surface:#17171b; --surface-2:#1f1f24;
  --surface-3:#2a2a31; --surface-hover:#31313a;
  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.14);
  --text:#f4f4f7; --text-2:#a1a1ad; --text-3:#6b6b78;
  --accent:#ff9f0a; --accent-soft:rgba(255,159,10,.15);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --purple:#bf5af2;
  --reader-bg:#0d0d10;
  --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:28px;
  --page-bg:#ffffff;
  --page-filter:none;
}
body.theme-light{
  --bg:#f0f0f4; --bg-2:#fafafc; --surface:#ffffff; --surface-2:#f4f4f7;
  --surface-3:#e8e8ee; --surface-hover:#e2e2ea;
  --border:rgba(0,0,0,.08); --border-2:rgba(0,0,0,.14);
  --text:#141418; --text-2:#5c5c68; --text-3:#8e8e9a;
  --accent:#f08c00; --accent-soft:rgba(240,140,0,.12);
  --reader-bg:#dcdce3;
  --shadow-sm:0 2px 8px rgba(0,0,0,.08);
  --shadow:0 8px 28px rgba(0,0,0,.12);
  --shadow-lg:0 24px 60px rgba(0,0,0,.18);
}
body.theme-sepia{
  --bg:#e8dcc4; --bg-2:#f1e8d6; --surface:#f8f2e4; --surface-2:#efe6d2;
  --surface-3:#e3d7bd; --surface-hover:#dbceb0;
  --border:rgba(91,70,54,.14); --border-2:rgba(91,70,54,.24);
  --text:#3d2f22; --text-2:#6b5a48; --text-3:#918270;
  --accent:#b3701a; --accent-soft:rgba(179,112,26,.14);
  --reader-bg:#d8c9ac;
  --shadow-sm:0 2px 8px rgba(90,70,40,.14);
  --shadow:0 8px 28px rgba(90,70,40,.2);
  --shadow-lg:0 24px 60px rgba(90,70,40,.3);
  --page-bg:#f6efdd;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .3s,color .3s;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}

/* ============================================================
   SHARED
   ============================================================ */
.view{position:fixed;inset:0;display:none;flex-direction:column}
.view.active{display:flex}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface-2);color:var(--text);border:1px solid var(--border);
  padding:9px 15px;border-radius:11px;font-size:.86rem;font-weight:600;
  transition:background .16s,border-color .16s,transform .1s,opacity .16s;white-space:nowrap;
}
.btn:hover{background:var(--surface-3);border-color:var(--border-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#1a1206;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:rgba(255,69,58,.12)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.sm{padding:6px 11px;font-size:.79rem;border-radius:9px}

.icon-btn{
  width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;
  justify-content:center;color:var(--text-2);font-size:.98rem;
  transition:background .16s,color .16s,transform .1s;flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn:active{transform:scale(.93)}
.icon-btn.active{background:var(--accent-soft);color:var(--accent)}
.icon-btn.sm{width:32px;height:32px;font-size:.85rem;border-radius:9px}

.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;
  background:var(--surface-2);border:1px solid var(--border);
  font-size:.75rem;font-weight:600;color:var(--text-2);
}

.spinner{
  width:26px;height:26px;border:2.5px solid var(--border-2);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   LIBRARY VIEW
   ============================================================ */
#libraryView{background:var(--bg);overflow-y:auto;display:block}
#libraryView:not(.active){display:none}

.lib-topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:1px solid var(--border);
}
.lib-topbar-inner{
  max-width:1440px;margin:0 auto;padding:14px 28px;
  display:flex;align-items:center;gap:18px;
}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand-mark{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(140deg,#ff9f0a,#ff6b00);color:#1a1206;font-size:1.05rem;
  box-shadow:0 4px 14px rgba(255,140,0,.34);
}
.brand-text{font-weight:800;font-size:1.12rem;letter-spacing:-.025em}
.brand-text small{display:block;font-size:.66rem;font-weight:600;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase}

.search-wrap{position:relative;flex:1;max-width:460px}
.search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:.85rem;pointer-events:none}
.search-input{
  width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:10px 36px 10px 38px;font-size:.88rem;color:var(--text);
  outline:none;transition:border-color .18s,background .18s;
}
.search-input::placeholder{color:var(--text-3)}
.search-input:focus{border-color:var(--accent);background:var(--surface)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:7px;display:none;place-items:center;color:var(--text-3)}
.search-clear:hover{background:var(--surface-3);color:var(--text)}
.search-wrap.has-value .search-clear{display:grid}

.top-actions{display:flex;align-items:center;gap:10px;margin-left:auto}

.lib-main{max-width:1440px;margin:0 auto;padding:28px 28px 90px;width:100%}

/* hero */
.hero{
  position:relative;border-radius:var(--r-xl);overflow:hidden;margin-bottom:34px;
  background:linear-gradient(120deg,var(--surface-2),var(--surface));
  border:1px solid var(--border);display:flex;gap:26px;padding:26px;
  box-shadow:var(--shadow);
}
.hero::before{
  content:'';position:absolute;right:-90px;top:-110px;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,159,10,.22),transparent 68%);pointer-events:none;
}
.hero-cover{
  width:132px;flex-shrink:0;aspect-ratio:3/4;border-radius:12px;overflow:hidden;
  background:var(--surface-3);box-shadow:var(--shadow);position:relative;z-index:1;
}
.hero-cover img{width:100%;height:100%;object-fit:cover;display:block}
.hero-cover .ph{width:100%;height:100%;display:grid;place-items:center;font-size:2rem;color:var(--text-3)}
.hero-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
.hero-eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.hero-title{font-size:1.72rem;font-weight:800;letter-spacing:-.03em;line-height:1.18;margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-meta{font-size:.84rem;color:var(--text-2);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.hero-progress{margin-top:16px;max-width:420px}
.progress-track{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.progress-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#ff9f0a,#ff7a00);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress-label{font-size:.72rem;color:var(--text-3);margin-top:7px;font-weight:600}

/* stats */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:34px}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px 18px;display:flex;align-items:center;gap:14px;transition:transform .16s,border-color .16s;
}
.stat-card:hover{transform:translateY(-2px);border-color:var(--border-2)}
.stat-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1rem;flex-shrink:0}
.stat-val{font-size:1.32rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat-lbl{font-size:.72rem;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

/* section head */
.section-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.section-title{font-size:1.16rem;font-weight:750;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.section-count{font-size:.76rem;color:var(--text-3);font-weight:700;background:var(--surface-2);padding:3px 9px;border-radius:20px}
.section-tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.select{
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;font-size:.82rem;font-weight:600;color:var(--text);outline:none;cursor:pointer;
}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 10px;border-radius:7px;font-size:.8rem;color:var(--text-3);transition:all .15s}
.seg button.active{background:var(--surface-3);color:var(--text)}

/* book grid */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:26px 22px}
.book-card{position:relative;cursor:pointer;animation:fadeUp .35s backwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.book-thumb{
  position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--surface-2);
  box-shadow:var(--shadow);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;
  border:1px solid var(--border);
}
.book-card:hover .book-thumb{transform:translateY(-6px) scale(1.015);box-shadow:var(--shadow-lg)}
.book-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.book-thumb .ph{
  width:100%;height:100%;display:grid;place-items:center;font-size:2.6rem;color:var(--text-3);
  background:linear-gradient(150deg,var(--surface-3),var(--surface-2));
}
.book-thumb .ph small{display:block;font-size:.62rem;margin-top:8px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.book-badge{
  position:absolute;top:8px;left:8px;padding:4px 9px;border-radius:20px;font-size:.66rem;font-weight:800;
  background:rgba(0,0,0,.62);color:#fff;backdrop-filter:blur(8px);letter-spacing:.03em;
  display:flex;align-items:center;gap:5px;
}
.book-badge.done{background:rgba(48,209,88,.9);color:#04240d}
.book-menu-btn{
  position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(8px);opacity:0;transition:opacity .18s,background .18s;
  font-size:.8rem;
}
.book-card:hover .book-menu-btn{opacity:1}
.book-menu-btn:hover{background:rgba(0,0,0,.8)}
.book-progress{
  position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.35);
}
.book-progress > div{height:100%;background:var(--accent);transition:width .4s}
.book-info{padding:11px 3px 0}
.book-name{
  font-size:.87rem;font-weight:650;line-height:1.35;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.book-sub{font-size:.72rem;color:var(--text-3);margin-top:4px;font-weight:600;display:flex;gap:8px;align-items:center}

/* list view */
.book-grid.list{grid-template-columns:1fr;gap:10px}
.book-grid.list .book-card{display:flex;align-items:center;gap:16px;padding:10px;border-radius:14px;border:1px solid transparent;transition:background .16s,border-color .16s}
.book-grid.list .book-card:hover{background:var(--surface);border-color:var(--border)}
.book-grid.list .book-thumb{width:60px;aspect-ratio:3/4;flex-shrink:0;box-shadow:var(--shadow-sm)}
.book-grid.list .book-info{padding:0;flex:1;min-width:0}
.book-grid.list .book-name{-webkit-line-clamp:1}
.book-grid.list .book-progress{position:static;height:5px;margin-top:9px;border-radius:4px;max-width:280px}
.book-grid.list .book-menu-btn{position:static;opacity:1;background:transparent;color:var(--text-3);width:34px;height:34px}
.book-grid.list .book-menu-btn:hover{background:var(--surface-3);color:var(--text)}
.book-grid.list .book-badge{position:static;background:var(--surface-2);color:var(--text-2);backdrop-filter:none}

/* empty state */
.empty{
  grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:70px 24px;text-align:center;gap:6px;
}
.empty-ico{
  width:88px;height:88px;border-radius:26px;display:grid;place-items:center;font-size:2.1rem;
  background:linear-gradient(140deg,var(--surface-3),var(--surface-2));color:var(--accent);margin-bottom:14px;
  box-shadow:var(--shadow);
}
.empty h3{font-size:1.32rem;font-weight:750;letter-spacing:-.02em}
.empty p{color:var(--text-2);font-size:.9rem;max-width:400px;line-height:1.6;margin-bottom:12px}
.empty-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* drop overlay */
.drop-overlay{
  position:fixed;inset:0;z-index:900;background:rgba(10,10,12,.88);backdrop-filter:blur(14px);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;
}
.drop-overlay.show{display:flex}
.drop-box{
  border:3px dashed var(--accent);border-radius:28px;padding:70px 90px;text-align:center;
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.03);opacity:1}}
.drop-box i{font-size:3.4rem;color:var(--accent);margin-bottom:18px;display:block}
.drop-box h3{font-size:1.4rem;font-weight:750;margin-bottom:6px}
.drop-box p{color:var(--text-2);font-size:.9rem}

/* import progress */
.import-bar{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:950;
  background:var(--surface);border:1px solid var(--border-2);border-radius:16px;
  padding:14px 20px;box-shadow:var(--shadow-lg);display:none;align-items:center;gap:14px;min-width:320px;
}
.import-bar.show{display:flex}
.import-bar .txt{font-size:.85rem;font-weight:600}
.import-bar .sub{font-size:.72rem;color:var(--text-3);margin-top:2px}

/* ============================================================
   READER VIEW
   ============================================================ */
#readerView{background:var(--reader-bg)}

.reader-bar{
  height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);z-index:60;flex-shrink:0;
}
.reader-title{
  flex:1;min-width:0;font-size:.9rem;font-weight:650;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;
  display:flex;flex-direction:column;line-height:1.25;
}
.reader-title small{font-size:.68rem;color:var(--text-3);font-weight:600}
.zoom-label{font-size:.76rem;font-weight:700;color:var(--text-2);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.bar-sep{width:1px;height:22px;background:var(--border-2);margin:0 4px;flex-shrink:0}

.reader-body{flex:1;display:flex;min-height:0;position:relative}

/* sidebar */
.sidebar{
  width:0;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  transition:width .28s cubic-bezier(.2,.8,.2,1);
}
.sidebar.open{width:292px}
.sidebar-inner{width:292px;display:flex;flex-direction:column;height:100%}
.sidebar-tabs{display:flex;padding:8px;gap:2px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-tabs button{
  flex:1;padding:8px 4px;border-radius:9px;font-size:.72rem;font-weight:700;color:var(--text-3);
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s;
}
.sidebar-tabs button i{font-size:.9rem}
.sidebar-tabs button:hover{background:var(--surface-2);color:var(--text-2)}
.sidebar-tabs button.active{background:var(--accent-soft);color:var(--accent)}
.sidebar-panel{flex:1;overflow-y:auto;display:none;padding:12px}
.sidebar-panel.active{display:block}

.thumb-item{
  display:flex;gap:11px;align-items:center;padding:8px;border-radius:11px;cursor:pointer;
  margin-bottom:5px;transition:background .15s;border:1px solid transparent;
}
.thumb-item:hover{background:var(--surface-2)}
.thumb-item.active{background:var(--accent-soft);border-color:rgba(255,159,10,.3)}
.thumb-canvas{
  width:56px;flex-shrink:0;aspect-ratio:3/4;border-radius:6px;background:var(--surface-3);
  overflow:hidden;box-shadow:var(--shadow-sm);display:grid;place-items:center;
}
.thumb-canvas canvas{width:100%;height:100%;display:block}
.thumb-canvas .n{font-size:.65rem;color:var(--text-3);font-weight:700}
.thumb-label{font-size:.78rem;font-weight:650;color:var(--text-2)}
.thumb-item.active .thumb-label{color:var(--accent)}

.outline-item{
  display:block;width:100%;text-align:left;padding:9px 11px;border-radius:9px;
  font-size:.82rem;font-weight:600;color:var(--text-2);transition:all .15s;line-height:1.4;
}
.outline-item:hover{background:var(--surface-2);color:var(--text)}
.outline-item.sub{padding-left:26px;font-size:.78rem;font-weight:500;color:var(--text-3)}
.outline-item .pg{margin-left:7px;font-size:.7rem;color:var(--text-3);font-weight:700}

.sidebar-empty{text-align:center;padding:46px 18px;color:var(--text-3);font-size:.82rem;line-height:1.6}
.sidebar-empty i{font-size:1.9rem;display:block;margin-bottom:12px;opacity:.45}

.bm-item,.note-item{
  background:var(--surface-2);border:1px solid var(--border);border-radius:11px;
  padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:all .15s;position:relative;
}
.bm-item:hover,.note-item:hover{border-color:var(--border-2);background:var(--surface-3)}
.bm-item .t,.note-item .t{font-size:.79rem;font-weight:700;display:flex;align-items:center;gap:7px}
.bm-item .d,.note-item .d{font-size:.72rem;color:var(--text-3);margin-top:4px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bm-item .x,.note-item .x{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:7px;
  display:grid;place-items:center;color:var(--text-3);font-size:.72rem;opacity:0;transition:opacity .15s}
.bm-item:hover .x,.note-item:hover .x{opacity:1}
.bm-item .x:hover,.note-item .x:hover{background:rgba(255,69,58,.15);color:var(--red)}

.search-result{
  padding:10px 11px;border-radius:10px;cursor:pointer;margin-bottom:5px;transition:background .15s;
  border:1px solid transparent;
}
.search-result:hover{background:var(--surface-2);border-color:var(--border)}
.search-result .pg{font-size:.68rem;font-weight:800;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.search-result .sn{font-size:.78rem;color:var(--text-2);margin-top:5px;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search-result mark{background:rgba(255,159,10,.35);color:var(--text);border-radius:3px;padding:0 2px;font-weight:700}
.search-status{padding:12px;font-size:.78rem;color:var(--text-3);text-align:center}

/* viewer */
.viewer{
  flex:1;overflow:auto;position:relative;background:var(--reader-bg);
  scroll-behavior:auto;overscroll-behavior:contain;
}
.pages{
  display:flex;flex-direction:column;align-items:center;gap:20px;
  padding:26px 20px 110px;min-height:100%;
}
.pdf-page{
  position:relative;width:var(--page-w,760px);background:var(--page-bg);
  border-radius:4px;overflow:hidden;box-shadow:0 6px 26px rgba(0,0,0,.4);
  aspect-ratio:3/4;flex-shrink:0;contain:layout paint;
}
.pdf-page canvas{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  filter:var(--page-filter);
}
.page-loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--page-bg);z-index:5}
.page-loading .spinner{width:22px;height:22px;border-width:2px}

/* highlight overlay */
.hl-layer{position:absolute;inset:0;z-index:1;pointer-events:none}
.hl-rect{position:absolute;border-radius:3px;mix-blend-mode:multiply;opacity:.55}

/* text layer */
.textLayer{
  position:absolute;inset:0;overflow:hidden;line-height:1;z-index:2;
  text-size-adjust:none;-webkit-text-size-adjust:none;forced-color-adjust:none;
  transform-origin:0 0;opacity:1;
}
.textLayer span,.textLayer br{
  color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%;
}
.textLayer ::selection{background:rgba(10,132,255,.4)}
.textLayer span.match{background:rgba(255,200,0,.45);border-radius:3px}
.textLayer span.match.current{background:rgba(255,120,0,.6)}

/* floating selection toolbar */
.sel-toolbar{
  position:fixed;z-index:400;background:var(--surface-3);border:1px solid var(--border-2);
  border-radius:13px;padding:6px;display:none;gap:3px;box-shadow:var(--shadow-lg);
  backdrop-filter:blur(14px);
}
.sel-toolbar.show{display:flex;animation:popIn .16s ease-out}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.94)}to{opacity:1;transform:none}}
.sel-toolbar button{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--text-2);font-size:.86rem;transition:all .14s;
}
.sel-toolbar button:hover{background:var(--surface-hover);color:var(--text)}
.sel-toolbar .dot{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.sel-toolbar .dot i{width:16px;height:16px;border-radius:5px;display:block;border:2px solid rgba(255,255,255,.25)}
.sel-toolbar .sep{width:1px;background:var(--border-2);margin:5px 3px}

/* reader footer */
.reader-foot{
  height:50px;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--border);z-index:60;flex-shrink:0;
}
.page-slider{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;
  background:var(--surface-3);outline:none;cursor:pointer;min-width:60px}
.page-slider::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--accent);cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.4);transition:transform .14s}
.page-slider::-webkit-slider-thumb:hover{transform:scale(1.18)}
.page-slider::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
.page-num-box{
  display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:650;color:var(--text-2);
  background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:5px 10px;
}
.page-num-box input{
  width:42px;background:transparent;border:none;outline:none;text-align:center;
  font-size:.8rem;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;
}

/* ============================================================
   MODALS / MENUS / TOAST
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.66);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;padding:22px;
  opacity:0;pointer-events:none;transition:opacity .24s;
}
.overlay.show{opacity:1;pointer-events:all}
.modal{
  background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-xl);
  width:100%;max-width:520px;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-lg);
  transform:scale(.95) translateY(10px);transition:transform .24s cubic-bezier(.2,.8,.2,1);
}
.overlay.show .modal{transform:none}
.modal-head{padding:22px 24px 0;display:flex;align-items:flex-start;gap:14px}
.modal-head h2{font-size:1.22rem;font-weight:780;letter-spacing:-.025em;flex:1;line-height:1.3}
.modal-head p{font-size:.85rem;color:var(--text-2);margin-top:7px;line-height:1.6}
.modal-body{padding:20px 24px}
.modal-foot{padding:0 24px 22px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal-ico{
  width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.35rem;flex-shrink:0;
  background:var(--accent-soft);color:var(--accent);
}
.modal-ico.blue{background:rgba(10,132,255,.15);color:var(--blue)}
.modal-ico.green{background:rgba(48,209,88,.15);color:var(--green)}

.perm-list{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.perm-item{display:flex;gap:13px;align-items:flex-start;padding:13px;border-radius:13px;
  background:var(--surface-2);border:1px solid var(--border)}
.perm-item i{font-size:.95rem;color:var(--accent);margin-top:2px;width:18px;text-align:center}
.perm-item b{font-size:.84rem;font-weight:700;display:block;margin-bottom:3px}
.perm-item span{font-size:.79rem;color:var(--text-2);line-height:1.55}

.kbd-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px}
.kbd-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.82rem;color:var(--text-2)}
kbd{
  background:var(--surface-3);border:1px solid var(--border-2);border-bottom-width:2px;
  border-radius:6px;padding:3px 7px;font-size:.72rem;font-weight:700;font-family:inherit;color:var(--text);
}

/* dropdown menu */
.menu{
  position:fixed;z-index:900;background:var(--surface-3);border:1px solid var(--border-2);
  border-radius:14px;padding:6px;box-shadow:var(--shadow-lg);min-width:196px;display:none;
  backdrop-filter:blur(20px);transform-origin:top right;
}
.menu.show{display:block;animation:menuIn .14s ease-out}
@keyframes menuIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.menu button{
  width:100%;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;
  font-size:.83rem;font-weight:600;color:var(--text-2);text-align:left;transition:all .13s;
}
.menu button:hover{background:var(--surface-hover);color:var(--text)}
.menu button i{width:16px;text-align:center;font-size:.85rem;color:var(--text-3)}
.menu button:hover i{color:var(--accent)}
.menu button.danger{color:var(--red)}
.menu button.danger i{color:var(--red)}
.menu button.on i{color:var(--accent)}
.menu hr{border:none;border-top:1px solid var(--border);margin:5px 8px}
.menu .menu-label{padding:7px 11px 4px;font-size:.66rem;font-weight:800;color:var(--text-3);
  letter-spacing:.08em;text-transform:uppercase}

/* toast */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:1000;
  display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{
  background:var(--surface-3);border:1px solid var(--border-2);border-radius:13px;
  padding:11px 18px;font-size:.83rem;font-weight:600;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:10px;animation:toastIn .24s cubic-bezier(.2,.8,.2,1);
  backdrop-filter:blur(16px);max-width:90vw;
}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .22s forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}
.toast i{font-size:.95rem}
.toast.ok i{color:var(--green)}
.toast.err i{color:var(--red)}
.toast.info i{color:var(--blue)}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:900px){
  .lib-topbar-inner{padding:12px 16px;gap:12px;flex-wrap:wrap}
  .brand-text small{display:none}
  .search-wrap{order:3;flex-basis:100%;max-width:none}
  .lib-main{padding:18px 16px 90px}
  .hero{flex-direction:column;padding:20px;gap:18px}
  .hero-cover{width:104px}
  .hero-title{font-size:1.35rem}
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:20px 14px}
  .sidebar{position:absolute;left:0;top:0;bottom:0;z-index:70;box-shadow:var(--shadow-lg)}
  .sidebar.open{width:280px}
  .sidebar-inner{width:280px}
  .reader-title small{display:none}
  .stats-row{grid-template-columns:1fr 1fr}
  .kbd-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .reader-bar{padding:0 6px;gap:2px}
  .zoom-label,.bar-sep{display:none}
  .reader-foot{padding:0 10px;gap:8px}
  .lib-main{padding:14px 12px 90px}
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px 12px}
  .hero-cover{width:88px}
}
/* ===== Annotation & Appearance layer ===== */
.pdf-page .page-tint{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  transition:opacity .2s;
}
.pdf-page .draw-canvas{
  position:absolute;inset:0;z-index:3;
  pointer-events:none;touch-action:none;
}
.pdf-page .draw-canvas.active{pointer-events:auto;cursor:crosshair}

.pin-marker{
  position:absolute;z-index:5;width:28px;height:28px;
  transform:translate(-50%,-100%);cursor:pointer;pointer-events:auto;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.45));
  transition:transform .16s;
}
.pin-marker:hover{transform:translate(-50%,-100%) scale(1.15)}
.pin-marker .pin-head{
  width:24px;height:24px;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);display:grid;place-items:center;
  border:2px solid rgba(255,255,255,.9);
}
.pin-marker .pin-head i{transform:rotate(45deg);font-size:.62rem;color:#fff}
.pin-marker .pin-tail{
  position:absolute;left:50%;bottom:-2px;width:2px;height:8px;
  background:rgba(0,0,0,.4);transform:translateX(-50%);
}

.pin-note-popup{
  position:fixed;z-index:600;background:var(--surface-3);
  border:1px solid var(--border-2);border-radius:14px;padding:12px;
  box-shadow:var(--shadow-lg);width:250px;display:none;
}
.pin-note-popup.show{display:block;animation:popIn .16s ease-out}
.pin-note-popup textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:9px;padding:9px;font-size:.82rem;color:var(--text);
  resize:vertical;min-height:72px;outline:none;font-family:inherit;
}
.pin-note-popup textarea:focus{border-color:var(--accent)}
.pin-note-popup .actions{display:flex;gap:6px;margin-top:9px;justify-content:flex-end}

.color-palette{
  position:fixed;z-index:600;background:var(--surface-3);
  border:1px solid var(--border-2);border-radius:14px;padding:11px;
  box-shadow:var(--shadow-lg);display:none;gap:8px;flex-wrap:wrap;width:186px;
}
.color-palette.show{display:flex;animation:menuIn .14s ease-out}
.color-swatch{
  width:30px;height:30px;border-radius:50%;cursor:pointer;
  border:2px solid rgba(255,255,255,.2);transition:transform .14s;
}
.color-swatch:hover{transform:scale(1.14)}
.color-swatch.active{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}

.appearance-panel{
  position:fixed;z-index:600;background:var(--surface-3);
  border:1px solid var(--border-2);border-radius:16px;padding:16px;
  box-shadow:var(--shadow-lg);width:290px;display:none;
}
.appearance-panel.show{display:block;animation:menuIn .14s ease-out}
.appearance-row{margin-bottom:15px}
.appearance-row:last-child{margin-bottom:0}
.appearance-row label{
  font-size:.74rem;font-weight:700;color:var(--text-2);
  display:flex;justify-content:space-between;margin-bottom:8px;
  letter-spacing:.02em;text-transform:uppercase;
}
.appearance-row label span{color:var(--accent);font-variant-numeric:tabular-nums}
.appearance-row input[type=range]{width:100%;-webkit-appearance:none;height:5px;
  border-radius:5px;background:var(--surface-hover);outline:none}
.appearance-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
  width:16px;height:16px;border-radius:50%;background:var(--accent);
  cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.appearance-row input[type=range]::-moz-range-thumb{width:16px;height:16px;
  border:none;border-radius:50%;background:var(--accent);cursor:pointer}

.pattern-grid{display:flex;gap:8px}
.pattern-btn{
  flex:1;aspect-ratio:1.3;border-radius:10px;border:2px solid var(--border);
  background:#fff;cursor:pointer;transition:all .15s;position:relative;
}
.pattern-btn.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pattern-btn.blank{background:#fff}
.pattern-btn.lined{
  background-image:repeating-linear-gradient(transparent,transparent 8px,#b8b8b8 8px,#b8b8b8 9px);
}
.pattern-btn.dotted{
  background-image:radial-gradient(#b8b8b8 1px,transparent 1px);
  background-size:8px 8px;
}
.page-bg-swatches{display:flex;gap:8px;flex-wrap:wrap}
.page-bg-swatch{
  width:32px;height:32px;border-radius:9px;cursor:pointer;
  border:2px solid var(--border);transition:transform .14s;
}
.page-bg-swatch:hover{transform:scale(1.1)}
.page-bg-swatch.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

.icon-btn.pen-active{background:var(--accent);color:#1a1206}
.icon-btn.pin-active{background:#ff453a;color:#fff}
/* ===== Laptop / two-page spread ===== */
.viewer.spread .pages{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:14px;
  max-width:1700px;
  margin:0 auto;
  width:100%;
  align-items:start;
  justify-items:center;
}
.viewer.spread .pdf-page{
  width:100% !important;
  max-width:none;
}
.viewer.spread .pdf-page[data-page="1"]{
  grid-column:2;
}
.viewer.spread .pdf-page[data-page="1"] ~ .pdf-page[data-page="2"]{
  grid-column:1;
  grid-row:1;
}
/* Simpler: shift odd/even mapping visually */
.viewer.spread .pdf-page{--page-w:auto}

/* immersive / auto-hide reader bar */
.reader-bar{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.reader-bar.bar-hidden{transform:translateY(-120%);opacity:0;pointer-events:none}
.reader-foot{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.reader-foot.bar-hidden{transform:translateY(120%);opacity:0;pointer-events:none}
.immersive .viewer{padding-top:0}
.viewer{padding:0}

/* fullscreen tweaks */
:fullscreen .reader-bar,:fullscreen .reader-foot{background:rgba(20,20,24,.75)}

/* install banner */
.install-banner{
  position:fixed;left:18px;right:18px;bottom:18px;z-index:850;
  background:var(--surface);border:1px solid var(--border-2);
  border-radius:18px;padding:14px 18px;box-shadow:var(--shadow-lg);
  display:none;align-items:center;gap:14px;max-width:520px;margin:0 auto;
}
.install-banner.show{display:flex;animation:toastIn .28s ease-out}
.install-banner .ib-ico{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(140deg,#ff9f0a,#ff6b00);color:#1a1206;font-size:1.15rem;
}
.install-banner .ib-text{flex:1;min-width:0}
.install-banner .ib-text b{font-size:.9rem;font-weight:750;display:block}
.install-banner .ib-text span{font-size:.78rem;color:var(--text-2)}
.install-banner .ib-actions{display:flex;gap:8px;flex-shrink:0}

/* Ctrl+wheel zoom hint */
.zoom-hud{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);
  z-index:500;background:rgba(0,0,0,.72);color:#fff;border-radius:16px;
  padding:16px 26px;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;
  backdrop-filter:blur(14px);pointer-events:none;opacity:0;
  transition:opacity .18s,transform .18s;font-variant-numeric:tabular-nums;
}
.zoom-hud.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* laptop: page corner shadows for the spread look */
@media (min-width:1100px){
  .pdf-page{box-shadow:0 8px 32px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03)}
}

/* fix: allow text selection on the PDF text layer on desktop */
.textLayer,.textLayer *{user-select:text !important;-webkit-user-select:text !important}

/* scrollbar for viewer area */
.viewer::-webkit-scrollbar{width:12px}
.viewer::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:10px;border:3px solid transparent;background-clip:content-box}
.viewer::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}
</style>

<script>
/* ============================================================================
   LIBRE — Personal PDF Library & Reader
   ============================================================================ */
(function () {
'use strict';

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

/* ---------------------------------------------------------------------------
   Helpers
   --------------------------------------------------------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function fmtBytes(b) {
  if (!b && b !== 0) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
}
function fmtDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts), now = Date.now(), diff = now - ts;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
  if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}
function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* ---------------------------------------------------------------------------
   IndexedDB storage layer
   --------------------------------------------------------------------------- */
const Store = {
  db: null,
  async init() {
    this.db = await new Promise((res, rej) => {
      const req = indexedDB.open('LibreLibrary', 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('books')) {
          const os = d.createObjectStore('books', { keyPath: 'id' });
          os.createIndex('lastOpenedAt', 'lastOpenedAt');
          os.createIndex('addedAt', 'addedAt');
        }
        if (!d.objectStoreNames.contains('files')) {
          d.createObjectStore('files', { keyPath: 'id' });
        }
        if (!d.objectStoreNames.contains('settings')) {
          d.createObjectStore('settings', { keyPath: 'key' });
        }
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
    return this.db;
  },
  _req(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode);
      const os = tx.objectStore(store);
      const r = fn(os);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  getAllBooks()       { return this._req('books', 'readonly', os => os.getAll()); },
  getBook(id)         { return this._req('books', 'readonly', os => os.get(id)); },
  putBook(b)          { return this._req('books', 'readwrite', os => os.put(b)); },
  deleteBook(id)      { return this._req('books', 'readwrite', os => os.delete(id)); },
  getFile(id)         { return this._req('files', 'readonly', os => os.get(id)).then(r => r && r.blob); },
  putFile(id, blob)   { return this._req('files', 'readwrite', os => os.put({ id, blob })); },
  deleteFile(id)      { return this._req('files', 'readwrite', os => os.delete(id)); },
  getSetting(k)       { return this._req('settings', 'readonly', os => os.get(k)).then(r => r && r.value); },
  setSetting(k, v)    { return this._req('settings', 'readwrite', os => os.put({ key: k, value: v })); },
  async clearAll() {
    await this._req('books', 'readwrite', os => os.clear());
    await this._req('files', 'readwrite', os => os.clear());
  }
};

/* ---------------------------------------------------------------------------
   App state
   --------------------------------------------------------------------------- */
const state = {
  books: [],
  book: null,
  pdf: null,
  pageCount: 0,
  currentPage: 1,
  zoom: 1,
  theme: 'dark',
  nightInvert: false,
  sort: 'recent',
  viewMode: 'grid',
  filter: '',
  sidebarTab: 'thumbs',
  searchResults: [],
  searchQuery: '',
  textCache: {},
  outline: [],
  pageDims: {},
  visiblePages: new Set(),
  saveTimer: null,  ttsUtterance: null,
  ttsActive: false,
  // --- NEW: annotation + appearance ---
  penMode: false,
  pinMode: false,
  penColor: '#111111',
  penSize: 3,
  pageBrightness: 100,
  pageContrast: 100,
  pagePattern: 'blank',
  pageBg: '#ffffff',  editingPinId: null,
  // --- NEW: laptop features ---
  spreadMode: false,
  immersive: false,
  barHidden: false,
  installPrompt: null,
};

/* DOM */
const el = {
  libraryView: $('#libraryView'),
  readerView: $('#readerView'),
  libMain: $('#libMain'),
  heroSlot: $('#heroSlot'),
  statsRow: $('#statsRow'),
  bookGrid: $('#bookGrid'),
  bookCount: $('#bookCount'),
  libSearch: $('#libSearch'),
  searchWrap: $('#searchWrap'),
  searchClear: $('#searchClear'),
  sortSelect: $('#sortSelect'),
  viewSeg: $('#viewSeg'),
  storagePill: $('#storagePill'),
  uploadBtnTop: $('#uploadBtnTop'),
  themeBtn: $('#themeBtn'),
  fileInput: $('#fileInput'),
  dropOverlay: $('#dropOverlay'),
  importBar: $('#importBar'),
  importTxt: $('#importTxt'),
  importSub: $('#importSub'),
  ctxMenu: $('#ctxMenu'),
  toastWrap: $('#toastWrap'),
  // reader
  viewer: $('#viewer'),
  pages: $('#pages'),
  sidebar: $('#sidebar'),
  sidebarBtn: $('#sidebarBtn'),
  backBtn: $('#backBtn'),
  readerTitle: $('#readerTitle'),
  readerSub: $('#readerSub'),
  zoomIn: $('#zoomIn'),
  zoomOut: $('#zoomOut'),
  zoomLabel: $('#zoomLabel'),
  fitBtn: $('#fitBtn'),
  searchBtn: $('#searchBtn'),
  bookmarkBtn: $('#bookmarkBtn'),
  ttsBtn: $('#ttsBtn'),
  moreBtn: $('#moreBtn'),
  prevBtn: $('#prevBtn'),
  nextBtn: $('#nextBtn'),
  pageSlider: $('#pageSlider'),
  pageInput: $('#pageInput'),
  pageTotal: $('#pageTotal'),
  docSearch: $('#docSearch'),
  searchResults: $('#searchResults'),
    selToolbar: $('#selToolbar'),
  penBtn: $('#penBtn'),
  pinBtn: $('#pinBtn'),
  colorBtn: $('#colorBtn'),
  appearanceBtn: $('#appearanceBtn'),
  colorPalette: $('#colorPalette'),
  appearancePanel: $('#appearancePanel'),
  pinNotePopup: $('#pinNotePopup'),
  pinNoteText: $('#pinNoteText'),
  brightnessSlider: $('#brightnessSlider'),
  brightnessVal: $('#brightnessVal'),
  contrastSlider: $('#contrastSlider'),
  contrastVal: $('#contrastVal'),  penSizeSlider: $('#penSizeSlider'),
  penSizeVal: $('#penSizeVal'),
  spreadBtn: $('#spreadBtn'),
  immersiveBtn: $('#immersiveBtn'),
  readerBar: $('.reader-bar'),
};

/* ---------------------------------------------------------------------------
   Toast
   --------------------------------------------------------------------------- */
function toast(msg, type = 'info', ms = 2600) {
  const icons = { ok: 'fa-circle-check', err: 'fa-circle-exclamation', info: 'fa-circle-info' };
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${escapeHtml(msg)}</span>`;
  el.toastWrap.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 240); }, ms);
}

/* ---------------------------------------------------------------------------
   Theme
   --------------------------------------------------------------------------- */
const THEMES = ['dark', 'light', 'sepia'];
function setTheme(theme) {
  state.theme = theme;
  document.body.className = 'theme-' + theme;
  Store.setSetting('theme', theme);
}
el.themeBtn.addEventListener('click', () => {
  setTheme(THEMES[(THEMES.indexOf(state.theme) + 1) % THEMES.length]);
});

/* ---------------------------------------------------------------------------
   Storage estimate + persistence
   --------------------------------------------------------------------------- */
async function updateStoragePill() {
  try {
    const est = await navigator.storage.estimate();
    const used = est.usage || 0;
    const quota = est.quota || 0;
    const pct = quota ? Math.round((used / quota) * 100) : 0;
    el.storagePill.innerHTML =
      `<i class="fas fa-database"></i> <span>${fmtBytes(used)} · ${pct}%</span>`;
    el.storagePill.title = `${fmtBytes(used)} used of ${fmtBytes(quota)} available`;
  } catch (e) { /* noop */ }
}

async function requestPersistence(silent) {
  if (!navigator.storage || !navigator.storage.persist) return false;
  try {
    const already = await navigator.storage.persisted();
    if (already) return true;
    if (silent) return false;
    const granted = await navigator.storage.persist();
    return granted;
  } catch (e) { return false; }
}

/* ---------------------------------------------------------------------------
   Welcome / permission modal
   --------------------------------------------------------------------------- */
function showWelcomeModal() {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal" style="max-width:560px">
      <div class="modal-head">
        <div class="modal-ico"><i class="fas fa-book-open-reader"></i></div>
        <div style="flex:1">
          <h2>Welcome to Libre</h2>
          <p>Your own private library for PDFs — everything stays on this device.</p>
        </div>
      </div>
      <div class="modal-body">
        <div class="perm-list">
          <div class="perm-item">
            <i class="fas fa-hard-drive"></i>
            <div><b>Stored permanently on your device</b>
            <span>PDFs are saved in your browser's local database. Nothing is uploaded to any server.</span></div>
          </div>
          <div class="perm-item">
            <i class="fas fa-shield-halved"></i>
            <div><b>Protected from automatic cleanup</b>
            <span>Granting persistent storage stops the browser from deleting your library when space runs low.</span></div>
          </div>
          <div class="perm-item">
            <i class="fas fa-wand-magic-sparkles"></i>
            <div><b>Everything you need to read well</b>
            <span>Bookmarks, highlights, notes, outline navigation, full‑text search, read‑aloud and more.</span></div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" id="wSkip">Not now</button>
        <button class="btn primary" id="wAllow"><i class="fas fa-check"></i> Allow &amp; continue</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add('show'));

  const close = () => { ov.classList.remove('show'); setTimeout(() => ov.remove(), 260); };

  $('#wSkip', ov).addEventListener('click', async () => {
    await Store.setSetting('welcomed', true);
    close();
  });
  $('#wAllow', ov).addEventListener('click', async () => {
    const ok = await requestPersistence(false);
    await Store.setSetting('welcomed', true);
    await Store.setSetting('persisted', ok);
    close();
    toast(ok ? 'Persistent storage granted — your library is safe.' : 'Library saved locally. Storage is best‑effort.',
          ok ? 'ok' : 'info', 3400);
    updateStoragePill();
  });
}

/* ---------------------------------------------------------------------------
   Library: rendering
   --------------------------------------------------------------------------- */
function bookProgressPct(b) {
  if (!b.progress || !b.pageCount) return 0;
  return clamp(Math.round(((b.progress.page || 1) / b.pageCount) * 100), 0, 100);
}

function sortedBooks() {
  let list = state.books.slice();
  const q = state.filter.trim().toLowerCase();
  if (q) list = list.filter(b => (b.title || '').toLowerCase().includes(q));
  const s = state.sort;
  list.sort((a, b) => {
    if (s === 'recent')   return (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0) || (b.addedAt || 0) - (a.addedAt || 0);
    if (s === 'added')    return (b.addedAt || 0) - (a.addedAt || 0);
    if (s === 'title')    return (a.title || '').localeCompare(b.title || '', undefined, { sensitivity: 'base' });
    if (s === 'progress') return bookProgressPct(b) - bookProgressPct(a);
    if (s === 'size')     return (b.size || 0) - (a.size || 0);
    return 0;
  });
  return list;
}

function renderLibrary() {
  const list = sortedBooks();
  el.bookCount.textContent = state.books.length;

  if (state.books.length === 0) {
    el.bookGrid.className = 'book-grid';
    el.bookGrid.innerHTML = `
      <div class="empty">
        <div class="empty-ico"><i class="fas fa-book-open"></i></div>
        <h3>Your library is empty</h3>
        <p>Add PDFs to build your personal collection. Files are stored permanently on this device — no account, no cloud, no limits.</p>
        <div class="empty-actions">
          <button class="btn primary" id="emptyAdd"><i class="fas fa-plus"></i> Add PDF files</button>
          <button class="btn" id="emptyDemo"><i class="fas fa-circle-info"></i> How it works</button>
        </div>
      </div>`;
    $('#emptyAdd').addEventListener('click', () => el.fileInput.click());
    $('#emptyDemo').addEventListener('click', () => {
      toast('Drop PDFs anywhere on this page to add them instantly.', 'info', 4000);
    });
    el.heroSlot.innerHTML = '';
    renderStats();
    return;
  }

  el.bookGrid.className = 'book-grid' + (state.viewMode === 'list' ? ' list' : '');
  el.bookGrid.innerHTML = list.map((b, i) => {
    const pct = bookProgressPct(b);
    const done = pct >= 99;
    const cover = b.cover
      ? `<img src="${b.cover}" alt="" loading="lazy">`
      : `<div class="ph"><div><i class="fas fa-file-pdf"></i><small>PDF</small></div></div>`;
    return `
      <div class="book-card" data-id="${b.id}" style="animation-delay:${Math.min(i * 22, 400)}ms">
        <div class="book-thumb">
          ${cover}
          ${done ? '<div class="book-badge done"><i class="fas fa-check"></i> Read</div>'
                 : (pct > 0 ? `<div class="book-badge">${pct}%</div>` : '')}
          <button class="book-menu-btn" data-menu="${b.id}"><i class="fas fa-ellipsis"></i></button>
          <div class="book-progress"><div style="width:${pct}%"></div></div>
        </div>
        <div class="book-info">
          <div class="book-name">${escapeHtml(b.title || 'Untitled')}</div>
          <div class="book-sub">
            <span><i class="fas fa-file-lines"></i> ${b.pageCount || '?'}p</span>
            <span>·</span>
            <span>${b.lastOpenedAt ? fmtDate(b.lastOpenedAt) : fmtDate(b.addedAt)}</span>
          </div>
        </div>
      </div>`;
  }).join('');

  // events
  $$('.book-card', el.bookGrid).forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('[data-menu]')) return;
      openBook(card.dataset.id);
    });
  });
  $$('[data-menu]', el.bookGrid).forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openBookMenu(btn.dataset.menu, btn.getBoundingClientRect());
    });
  });

  renderHero();
  renderStats();
}

function renderHero() {
  // most recently opened book with progress < 100, else most recent
  const candidates = state.books
    .filter(b => b.lastOpenedAt)
    .sort((a, b) => b.lastOpenedAt - a.lastOpenedAt);
  const target = candidates.find(b => bookProgressPct(b) < 99) || candidates[0];
  if (!target) { el.heroSlot.innerHTML = ''; return; }

  const pct = bookProgressPct(target);
  const page = target.progress?.page || 1;
  const cover = target.cover
    ? `<img src="${target.cover}" alt="">`
    : `<div class="ph"><i class="fas fa-file-pdf"></i></div>`;

  el.heroSlot.innerHTML = `
    <div class="hero">
      <div class="hero-cover">${cover}</div>
      <div class="hero-body">
        <div class="hero-eyebrow"><i class="fas fa-play-circle"></i> Continue reading</div>
        <div class="hero-title">${escapeHtml(target.title || 'Untitled')}</div>
        <div class="hero-meta">
          <span><i class="fas fa-file-lines"></i> ${target.pageCount} pages</span>
          <span><i class="fas fa-hard-drive"></i> ${fmtBytes(target.size)}</span>
          <span><i class="fas fa-clock-rotate-left"></i> ${fmtDate(target.lastOpenedAt)}</span>
        </div>
        <div class="hero-actions">
          <button class="btn primary" id="heroResume"><i class="fas fa-book-open"></i> Resume page ${page}</button>
          <button class="btn" id="heroRestart"><i class="fas fa-rotate-left"></i> Start over</button>
        </div>
        <div class="hero-progress">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">${pct}% complete · page ${page} of ${target.pageCount}</div>

  $('#heroResume').addEventListener('click', () => openBook(target.id));
  $('#heroRestart').addEventListener('click', () => {

}

   Book context menu
   --------------------------------------------------------------------------- */
let menuCleanup = null;
function closeMenu() {
  el.ctxMenu.classList.remove('show');
  if (menuCleanup) { menuCleanup(); menuCleanup = null; }
}
function openBookMenu(id, rect) {
  const b = state.books.find(x => x.id === id);
  if (!b) return;
  const pct = bookProgressPct(b);

  el.ctxMenu.innerHTML = `
    <button data-act="open"><i class="fas fa-book-open"></i> Open</button>
    <button data-act="rename"><i class="fas fa-pen"></i> Rename</button>
    ${pct > 0 ? '<button data-act="reset"><i class="fas fa-rotate-left"></i> Reset progress</button>' : ''}
    <hr>
    <button data-act="download"><i class="fas fa-download"></i> Download PDF</button>
    <button data-act="cover"><i class="fas fa-image"></i> Regenerate cover</button>
    <hr>
    <button data-act="delete" class="danger"><i class="fas fa-trash"></i> Delete</button>`;

  el.ctxMenu.classList.add('show');
  const w = el.ctxMenu.offsetWidth, h = el.ctxMenu.offsetHeight;
  let left = rect.right - w, top = rect.bottom + 8;
  if (left < 10) left = 10;
  if (top + h > innerHeight - 10) top = Math.max(10, rect.top - h - 8);
  el.ctxMenu.style.left = left + 'px';
  el.ctxMenu.style.top = top + 'px';

  const onDoc = e => { if (!el.ctxMenu.contains(e.target)) closeMenu(); };
  const onScroll = () => closeMenu();
  setTimeout(() => {
    document.addEventListener('mousedown', onDoc);
    window.addEventListener('scroll', onScroll, true);
  }, 0);
  menuCleanup = () => {
    document.removeEventListener('mousedown', onDoc);
    window.removeEventListener('scroll', onScroll, true);
  };

  $$('button', el.ctxMenu).forEach(btn => {
    btn.addEventListener('click', async () => {
      const act = btn.dataset.act;
      closeMenu();
      if (act === 'open') openBook(id);
      else if (act === 'rename') renameBook(b);
      else if (act === 'reset') {
        b.progress = { page: 1, updatedAt: Date.now() };
        await Store.putBook(b);
        renderLibrary();
        toast('Progress reset', 'ok');
      }
      else if (act === 'download') downloadBook(b);
      else if (act === 'cover') regenerateCover(b);
      else if (act === 'delete') deleteBook(b);
    });
  });
}

async function renameBook(b) {
  const name = prompt('Rename book', b.title || 'Untitled');
  if (name === null) return;
  b.title = name.trim() || 'Untitled';
  await Store.putBook(b);
  renderLibrary();
  toast('Renamed', 'ok');
}

async function downloadBook(b) {
  const blob = await Store.getFile(b.id);
  if (!blob) return toast('File not found', 'err');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (b.title || 'document') + '.pdf';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function regenerateCover(b) {
  const blob = await Store.getFile(b.id);
  if (!blob) return;
  toast('Generating cover…', 'info');
  try {
    const pdf = await pdfjsLib.getDocument({ data: await blob.arrayBuffer() }).promise;
    b.cover = await makeCover(pdf);
    b.pageCount = pdf.numPages;
    await Store.putBook(b);
    renderLibrary();
    toast('Cover updated', 'ok');
  } catch (e) { toast('Could not generate cover', 'err'); }
}

async function deleteBook(b) {
  if (!confirm(`Delete "${b.title}"?\nThis removes the file from this device permanently.`)) return;
  await Store.deleteBook(b.id);
  await Store.deleteFile(b.id);
  state.books = state.books.filter(x => x.id !== b.id);
  renderLibrary();
  toast('Book deleted', 'ok');
}

/* ---------------------------------------------------------------------------
   Import PDFs
   --------------------------------------------------------------------------- */
async function makeCover(pdf) {
  try {
    const page = await pdf.getPage(1);
    const vp1 = page.getViewport({ scale: 1 });
    const scale = Math.min(420 / vp1.width, 1.6);
    const vp = page.getViewport({ scale });
    const c = document.createElement('canvas');
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    return c.toDataURL('image/jpeg', 0.78);
  } catch (e) { return null; }
}

async function importFiles(files) {
  const pdfs = Array.from(files).filter(f =>
    f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if (!pdfs.length) { toast('Please choose PDF files', 'err'); return; }

  el.importBar.classList.add('show');
  let done = 0;

  for (const file of pdfs) {
    el.importTxt.textContent = `Importing “${file.name}”`;
    el.importSub.textContent = `${done + 1} of ${pdfs.length} · ${fmtBytes(file.size)}`;
    try {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
      const cover = await makeCover(pdf);

      const book = {
        id: uid(),
        title: file.name.replace(/\.pdf$/i, '').replace(/[_]+/g, ' ').trim() || 'Untitled',
        size: file.size,
        pageCount: pdf.numPages,
        cover,
        addedAt: Date.now(),
        lastOpenedAt: 0,
        progress: { page: 1, updatedAt: 0 },        bookmarks: [],
        highlights: [],
        notes: [],
        drawings: [],
        pins: [],
      };
      await Store.putBook(book);
      await Store.putFile(book.id, file);
      state.books.push(book);
      done++;
    } catch (err) {
      console.error('Import failed', file.name, err);
      toast(`Failed to import ${file.name}`, 'err');
    }
  }

  el.importBar.classList.remove('show');
  renderLibrary();
  await updateStoragePill();
  if (done) toast(`${done} book${done > 1 ? 's' : ''} added to your library`, 'ok');
}

async function openBook(id) {

  if (!book) return;
  const blob = await Store.getFile(id);

  try {
    const buf = await blob.arrayBuffer();

        state.book = book;
    state.pdf = pdf;
    book.drawings = book.drawings || [];
    book.pins = book.pins || [];
    book.highlights = book.highlights || [];

/* ---------------------------------------------------------------------------
   Page list construction
   --------------------------------------------------------------------------- */
let renderObserver = null, releaseObserver = null;

function buildPages() {
  el.pages.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= state.pageCount; i++) {
    const d = document.createElement('div');
    d.className = 'pdf-page';
    d.dataset.page = i;
    d.style.aspectRatio = '3 / 4';
        d.innerHTML =
      `<div class="page-loading"><div class="spinner"></div></div>
       <canvas></canvas>
       <div class="page-tint"></div>
       <div class="hl-layer"></div>
       <div class="textLayer"></div>`;
    frag.appendChild(d);
  }
  el.pages.appendChild(frag);

  if (renderObserver) renderObserver.disconnect();
  if (releaseObserver) releaseObserver.disconnect();

  renderObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        state.visiblePages.add(+en.target.dataset.page);
        renderPageEl(en.target);
      }
    });
  }, { root: el.viewer, rootMargin: '120% 0px' });

  releaseObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting && state.pageCount > 30) {
        state.visiblePages.delete(+en.target.dataset.page);
        releasePageEl(en.target);
      }
    });
  }, { root: el.viewer, rootMargin: '320% 0px' });

  $$('.pdf-page', el.pages).forEach(p => {
    renderObserver.observe(p);
    releaseObserver.observe(p);
  });
}

async function loadPageDimensions() {
  for (let i = 1; i <= state.pageCount; i++) {
    try {
      const p = await state.pdf.getPage(i);
      const vp = p.getViewport({ scale: 1 });
      state.pageDims[i] = { w: vp.width, h: vp.height };
      const node = el.pages.querySelector(`.pdf-page[data-page="${i}"]`);
      if (node) node.style.aspectRatio = `${vp.width} / ${vp.height}`;
    } catch (e) { /* ignore */ }
    if (i % 25 === 0) await new Promise(r => setTimeout(r, 0));
  }
}

function releasePageEl(node) {
  if (node.dataset.rendered !== '1') return;
  const c = node.querySelector('canvas');
  c.width = 0; c.height = 0;
  node.querySelector('.textLayer').innerHTML = '';
  node.dataset.rendered = '';
  node.dataset.rendering = '';
  if (!node.querySelector('.page-loading')) {
    const l = document.createElement('div');
    l.className = 'page-loading';
    l.innerHTML = '<div class="spinner"></div>';
    node.insertBefore(l, node.firstChild);
  }
}

async function renderPageEl(node, force) {
  const num = +node.dataset.page;
  if (!state.pdf) return;
  if (!force && (node.dataset.rendered === '1' || node.dataset.rendering === '1')) return;
  node.dataset.rendering = '1';

  try {
    const page = await state.pdf.getPage(num);
    const vp1 = page.getViewport({ scale: 1 });
    const cssW = node.clientWidth || 700;
    const scale = cssW / vp1.width;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const viewport = page.getViewport({ scale: scale * dpr });
    const canvas = node.querySelector('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);

    await page.render({ canvasContext: ctx, viewport }).promise;

    // Text layer
    const tl = node.querySelector('.textLayer');
    tl.innerHTML = '';
    const vpText = page.getViewport({ scale });
    tl.style.width = vpText.width + 'px';
    tl.style.height = vpText.height + 'px';
    let textContent = null;
    try { textContent = await page.getTextContent(); } catch (e) {}

    if (textContent && textContent.items.length) {
      let ok = false;
      try {
        await pdfjsLib.renderTextLayer({
          textContent, container: tl, viewport: vpText, textDivs: []
        }).promise;
        ok = tl.children.length > 0;
      } catch (e) { ok = false; }
      if (!ok) {
        try {
          await pdfjsLib.renderTextLayer({
            textContentSource: textContent, container: tl, viewport: vpText, textDivs: []
          }).promise;
        } catch (e) {}
      }
      if (state.searchQuery) applyMatchHighlight(num, state.searchQuery);
    }

        node.dataset.rendered = '1';
    node.dataset.rendering = '';
    const loader = node.querySelector('.page-loading');
    if (loader) loader.remove();

    renderHighlights(node, num);
    setupDrawCanvas(node, num);
    attachPinListener(node, num);
    redrawPageAnnotations(node, num);
    applyPageAppearanceTo(node);
  } catch (e) {
    node.dataset.rendering = '';
    console.warn('render page failed', num, e);
  }
}

/* ---------------------------------------------------------------------------
   Zoom / width
   --------------------------------------------------------------------------- */
function updatePageWidth() {
  const avail = el.viewer.clientWidth;
  const base = clamp(avail - (avail > 900 ? 120 : 40), 240, 980);
  const w = Math.round(base * state.zoom);
  el.pages.style.setProperty('--page-w', w + 'px');
  el.zoomLabel.textContent = Math.round(state.zoom * 100) + '%';
}

const refreshVisible = debounce(() => {
  updatePageWidth();
  state.visiblePages.forEach(n => {
    const node = el.pages.querySelector(`.pdf-page[data-page="${n}"]`);
    if (node) {
      node.dataset.rendered = '';
      const c = node.querySelector('canvas');
      c.width = 0; c.height = 0;
      node.querySelector('.textLayer').innerHTML = '';
      renderPageEl(node, true);
    }
  });
}, 130);

el.zoomIn.addEventListener('click', () => {
  state.zoom = clamp(state.zoom * 1.18, 0.35, 4);
  refreshVisible();
});
el.zoomOut.addEventListener('click', () => {
  state.zoom = clamp(state.zoom / 1.18, 0.35, 4);
  refreshVisible();
});
el.fitBtn.addEventListener('click', () => {
  state.zoom = 1;
  refreshVisible();
  toast('Fit to width', 'info', 1200);
});

window.addEventListener('resize', debounce(() => {
  if (el.readerView.classList.contains('active')) refreshVisible();
}, 180));

/* ---------------------------------------------------------------------------
   Scroll tracking / current page
   --------------------------------------------------------------------------- */
const onViewerScroll = () => {
  if (!state.pdf) return;
  const vTop = el.viewer.getBoundingClientRect().top;
  let best = state.currentPage, bestD = Infinity;
  state.visiblePages.forEach(n => {
    const node = el.pages.querySelector(`.pdf-page[data-page="${n}"]`);
    if (!node) return;
    const r = node.getBoundingClientRect();
    const d = Math.abs(r.top - vTop - 8);
    if (d < bestD) { bestD = d; best = n; }
  });
  setCurrentPage(best, false);
  scheduleSaveProgress();
};

el.viewer.addEventListener('scroll', onViewerScroll, { passive: true });

function setCurrentPage(n, scroll) {
  n = clamp(n, 1, state.pageCount || 1);
  if (state.currentPage !== n) {
    state.currentPage = n;
    el.pageSlider.value = n;
    if (document.activeElement !== el.pageInput) el.pageInput.value = n;
    updateBookmarkIcon();
    updateThumbActive();
    updateOutlineActive();
  }
  if (scroll) scrollToPage(n, true);
}

function scrollToPage(n, smooth) {
  const node = el.pages.querySelector(`.pdf-page[data-page="${n}"]`);
  if (!node) return;
  const top = node.offsetTop - 18;
  el.viewer.scrollTo({ top, behavior: smooth ? 'smooth' : 'auto' });
}

el.pageSlider.addEventListener('input', () => {
  const n = +el.pageSlider.value;
  state.currentPage = n;
  el.pageInput.value = n;
  scrollToPage(n, false);
  scheduleSaveProgress();
});
el.pageInput.addEventListener('change', () => {
  const n = clamp(parseInt(el.pageInput.value, 10) || 1, 1, state.pageCount);
  el.pageInput.value = n;
  setCurrentPage(n, true);
});
el.pageInput.addEventListener('keydown', e => { if (e.key === 'Enter') el.pageInput.blur(); });

el.prevBtn.addEventListener('click', () => { scrollToPage(state.currentPage - 1, true); });
el.nextBtn.addEventListener('click', () => { scrollToPage(state.currentPage + 1, true); });

/* ---------------------------------------------------------------------------
   Progress persistence
   --------------------------------------------------------------------------- */
function scheduleSaveProgress() {
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(saveProgress, 700);
}
async function saveProgress() {
  if (!state.book || !state.pdf) return;
  state.book.progress = {
    page: state.currentPage,
    percent: Math.round((state.currentPage / state.pageCount) * 100),
    updatedAt: Date.now()
  };
  await Store.putBook(state.book);
}

/* ---------------------------------------------------------------------------
   Bookmarks
   --------------------------------------------------------------------------- */
function updateBookmarkIcon() {
  const on = (state.book?.bookmarks || []).some(b => b.page === state.currentPage);
  el.bookmarkBtn.innerHTML = on ? '<i class="fas fa-bookmark"></i>' : '<i class="far fa-bookmark"></i>';
  el.bookmarkBtn.classList.toggle('active', on);
}

el.bookmarkBtn.addEventListener('click', async () => {
  if (!state.book) return;
  const list = state.book.bookmarks || (state.book.bookmarks = []);
  const idx = list.findIndex(b => b.page === state.currentPage);
  if (idx >= 0) {
    list.splice(idx, 1);
    toast('Bookmark removed', 'info', 1400);
  } else {
    list.push({
      id: uid(),
      page: state.currentPage,
      label: `Page ${state.currentPage}`,
      createdAt: Date.now()
    });
    toast('Bookmarked page ' + state.currentPage, 'ok', 1400);
  }
  list.sort((a, b) => a.page - b.page);
  await Store.putBook(state.book);
  updateBookmarkIcon();
  renderBookmarks();
});

function renderBookmarks() {
  const panel = $('#panel-bookmarks');
  const list = (state.book?.bookmarks || []).slice().sort((a, b) => a.page - b.page);
  if (!list.length) {
    panel.innerHTML = `<div class="sidebar-empty"><i class="far fa-bookmark"></i>No bookmarks yet.<br>Press <b>B</b> or tap the bookmark icon to save your place.</div>`;
    return;
  }
  panel.innerHTML = list.map(b => `
    <div class="bm-item" data-page="${b.page}">
      <div class="t"><i class="fas fa-bookmark" style="color:var(--accent)"></i> ${escapeHtml(b.label)}</div>
      <div class="d">Added ${fmtDate(b.createdAt)}</div>
      <button class="x" data-del="${b.id}"><i class="fas fa-xmark"></i></button>
    </div>`).join('');

  $$('.bm-item', panel).forEach(item => {
    item.addEventListener('click', e => {
      if (e.target.closest('[data-del]')) return;
      scrollToPage(+item.dataset.page, true);
    });
  });
  $$('[data-del]', panel).forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      state.book.bookmarks = state.book.bookmarks.filter(x => x.id !== btn.dataset.del);
      await Store.putBook(state.book);
      renderBookmarks(); updateBookmarkIcon();
    });
  });
}

/* ---------------------------------------------------------------------------
   Highlights & notes
   --------------------------------------------------------------------------- */
function renderHighlights(node, num) {
  const layer = node.querySelector('.hl-layer');
  layer.innerHTML = '';
  const list = (state.book?.highlights || []).filter(h => h.page === num);
  list.forEach(h => {
    (h.rects || []).forEach(r => {
      const d = document.createElement('div');
      d.className = 'hl-rect';
      d.style.left = (r.x * 100) + '%';
      d.style.top = (r.y * 100) + '%';
      d.style.width = (r.w * 100) + '%';
      d.style.height = (r.h * 100) + '%';
      d.style.background = h.color || 'rgba(255,214,10,.75)';
      d.title = h.note ? h.note : h.text;
      layer.appendChild(d);
    });
  });
}

let pendingSelection = null;

document.addEventListener('selectionchange', () => {
  if (!el.readerView.classList.contains('active')) return;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) {
    el.selToolbar.classList.remove('show');
    pendingSelection = null;
    return;
  }
  const range = sel.getRangeAt(0);
  const node = range.startContainer.nodeType === 1
    ? range.startContainer
    : range.startContainer.parentElement;
  const pageEl = node?.closest?.('.pdf-page');
  if (!pageEl || !el.pages.contains(pageEl)) {
    el.selToolbar.classList.remove('show');
    return;
  }

  const pageRect = pageEl.getBoundingClientRect();
  const rects = Array.from(range.getClientRects())
    .filter(r => r.width > 1 && r.height > 1)
    .map(r => ({
      x: (r.left - pageRect.left) / pageRect.width,
      y: (r.top - pageRect.top) / pageRect.height,
      w: r.width / pageRect.width,
      h: r.height / pageRect.height,
    }));
  if (!rects.length) return;

  pendingSelection = {
    page: +pageEl.dataset.page,
    rects,
    text: sel.toString().trim().slice(0, 800)
  };

  const box = range.getBoundingClientRect();
  el.selToolbar.classList.add('show');
  const tw = el.selToolbar.offsetWidth;
  let left = box.left + box.width / 2 - tw / 2;
  left = clamp(left, 10, innerWidth - tw - 10);
  let top = box.top - el.selToolbar.offsetHeight - 10;
  if (top < 8) top = box.bottom + 10;
  el.selToolbar.style.left = left + 'px';
  el.selToolbar.style.top = top + 'px';
});

$$('.dot', el.selToolbar).forEach(dot => {

function renderNotes() {
  const panel = $('#panel-notes');
  const notes = (state.book?.highlights || []).filter(h => h.note);
  if (!notes.length) {
    panel.innerHTML = `<div class="sidebar-empty"><i class="fas fa-note-sticky"></i>No notes yet.<br>Select text and tap the note icon.</div>`;
    return;
  }
  panel.innerHTML = notes.map(n => `
    <div class="note-item" data-page="${n.page}">
      <div class="t"><i class="fas fa-note-sticky" style="color:var(--blue)"></i> Page ${n.page}</div>
      <div class="d">${escapeHtml(n.note)}</div>
      <button class="x" data-del="${n.id}"><i class="fas fa-xmark"></i></button>
    </div>`).join('');

  $$('.note-item', panel).forEach(item => {
    item.addEventListener('click', e => {
      if (e.target.closest('[data-del]')) return;
      scrollToPage(+item.dataset.page, true);
    });

    btn.addEventListener('click', async e => {
