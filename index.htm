      state.book.highlights = state.book.highlights.filter(x => x.id !== btn.dataset.del);
      await Store.putBook(state.book);
      renderNotes();
      const n = state.currentPage;
      const node = el.pages.querySelector(`.pdf-page[data-page="${n}"]`);
      if (node) renderHighlights(node, n);
    });
  });
}

/* ---------------------------------------------------------------------------
   Outline
   --------------------------------------------------------------------------- */
async function loadOutline() {
  try {
    const raw = await state.pdf.getOutline();
    if (!raw || !raw.length) { state.outline = []; renderOutline(); return; }
    state.outline = await Promise.all(raw.map(async it => ({
      title: it.title,
      page: await destToPage(it.dest),
      items: it.items && it.items.length
        ? await Promise.all(it.items.map(async c => ({
            title: c.title, page: await destToPage(c.dest)
          })))
        : []
    })));
  } catch (e) { state.outline = []; }
  renderOutline();
}

async function destToPage(dest) {
  try {
    let d = dest;
    if (typeof d === 'string') d = await state.pdf.getDestination(d);
    if (!Array.isArray(d)) return null;
    const idx = await state.pdf.getPageIndex(d[0]);
    return idx + 1;
  } catch (e) { return null; }
}

function renderOutline() {
  const panel = $('#panel-outline');
  if (!state.outline.length) {
    panel.innerHTML = `<div class="sidebar-empty"><i class="fas fa-list-ul"></i>This PDF has no table of contents.</div>`;
    return;
  }
  panel.innerHTML = state.outline.map((item, i) => `
    ${item.page ? `<button class="outline-item" data-page="${item.page}">${escapeHtml(item.title)}<span class="pg">${item.page}</span></button>` : ''}
    ${(item.items || []).map(c => c.page
      ? `<button class="outline-item sub" data-page="${c.page}">${escapeHtml(c.title)}<span class="pg">${c.page}</span></button>`
      : '').join('')}
  `).join('');

  $$('.outline-item', panel).forEach(b => {
    b.addEventListener('click', () => scrollToPage(+b.dataset.page, true));
  });
}

function updateOutlineActive() {
  $$('.outline-item', $('#panel-outline')).forEach(b => {
    b.style.color = (+b.dataset.page === state.currentPage) ? 'var(--accent)' : '';
  });
}

/* ---------------------------------------------------------------------------
   Thumbnails
   --------------------------------------------------------------------------- */
let thumbObserver = null;
function buildThumbnails() {
  const panel = $('#panel-thumbs');
  panel.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= state.pageCount; i++) {
    const d = document.createElement('div');
    d.className = 'thumb-item';
    d.dataset.page = i;
    d.innerHTML = `<div class="thumb-canvas"><span class="n">${i}</span></div>
                   <div class="thumb-label">Page ${i}</div>`;
    frag.appendChild(d);
  }
  panel.appendChild(frag);

  panel.addEventListener('click', e => {
    const item = e.target.closest('.thumb-item');
    if (item) scrollToPage(+item.dataset.page, true);
  });

  if (thumbObserver) thumbObserver.disconnect();
  thumbObserver = new IntersectionObserver(entries => {
    entries.forEach(async en => {
      if (!en.isIntersecting) return;
      const item = en.target;
      if (item.dataset.rendered) return;
      item.dataset.rendered = '1';
      const num = +item.dataset.page;
      try {
        const page = await state.pdf.getPage(num);
        const vp1 = page.getViewport({ scale: 1 });
        const scale = 110 / vp1.width;
        const vp = page.getViewport({ scale });
        const c = document.createElement('canvas');
        c.width = vp.width; c.height = vp.height;
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        const holder = item.querySelector('.thumb-canvas');
        holder.innerHTML = '';
        holder.appendChild(c);
      } catch (e) { /* ignore */ }
    });
  }, { root: panel, rootMargin: '400px 0px' });

  $$('.thumb-item', panel).forEach(t => thumbObserver.observe(t));
}

function updateThumbActive() {
  const panel = $('#panel-thumbs');
  $$('.thumb-item', panel).forEach(t => {
    const on = +t.dataset.page === state.currentPage;
    t.classList.toggle('active', on);
    if (on && panel.offsetParent) {
      const r = t.getBoundingClientRect(), pr = panel.getBoundingClientRect();
      if (r.top < pr.top || r.bottom > pr.bottom) {
        t.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }
  });
}

/* ---------------------------------------------------------------------------
   In-document search
   --------------------------------------------------------------------------- */
async function getPageText(n) {
  if (state.textCache[n] !== undefined) return state.textCache[n];
  try {
    const p = await state.pdf.getPage(n);
    const tc = await p.getTextContent();
    const txt = tc.items.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
    state.textCache[n] = txt;
    return txt;
  } catch (e) { state.textCache[n] = ''; return ''; }
}

const runDocSearch = debounce(async q => {
  state.searchQuery = q;
  if (!q || q.length < 2) {
    el.searchResults.innerHTML = `<div class="search-status">Type at least 2 characters.</div>`;
    return;
  }
  el.searchResults.innerHTML = `<div class="search-status"><div class="spinner" style="margin:0 auto 10px"></div>Searching…</div>`;

  const lower = q.toLowerCase();
  const results = [];
  for (let i = 1; i <= state.pageCount; i++) {
    const text = await getPageText(i);
    if (!text) continue;
    const tl = text.toLowerCase();
    let idx = tl.indexOf(lower);
    while (idx !== -1 && results.length < 400) {
      results.push({
        page: i,
        before: text.slice(Math.max(0, idx - 45), idx),
        match: text.slice(idx, idx + q.length),
        after: text.slice(idx + q.length, idx + q.length + 55),
      });
      idx = tl.indexOf(lower, idx + lower.length);
    }
    if (i % 12 === 0) await new Promise(r => setTimeout(r, 0));
  }

  state.searchResults = results;

  if (!results.length) {
    el.searchResults.innerHTML = `<div class="search-status">No results for “${escapeHtml(q)}”.</div>`;
    return;
  }

  const re = new RegExp(escapeReg(q), 'gi');
  el.searchResults.innerHTML =
    `<div class="search-status" style="text-align:left;padding:2px 4px 10px">${results.length} match${results.length > 1 ? 'es' : ''}</div>` +
    results.map((r, i) => `
      <div class="search-result" data-page="${r.page}" data-i="${i}">
        <div class="pg">Page ${r.page}</div>
        <div class="sn">…${escapeHtml(r.before)}<mark>${escapeHtml(r.match)}</mark>${escapeHtml(r.after)}…</div>
      </div>`).join('');

  $$('.search-result', el.searchResults).forEach(node => {
    node.addEventListener('click', () => {
      const pg = +node.dataset.page;
      scrollToPage(pg, true);
      setTimeout(() => {
        const pageEl = el.pages.querySelector(`.pdf-page[data-page="${pg}"]`);
        if (pageEl) applyMatchHighlight(pg, q, true);
      }, 420);
    });
  });

  // highlight on currently rendered pages
  state.visiblePages.forEach(n => applyMatchHighlight(n, q));
}, 420);

function applyMatchHighlight(pageNum, q, scrollToFirst) {
  const node = el.pages.querySelector(`.pdf-page[data-page="${pageNum}"]`);
  if (!node || !q) return;
  const spans = $$('span', node.querySelector('.textLayer'));
  const lower = q.toLowerCase();
  let first = null;
  spans.forEach(sp => {
    const t = (sp.textContent || '').toLowerCase();
    if (t.includes(lower)) {
      sp.classList.add('match');
      if (!first) first = sp;
    } else {
      sp.classList.remove('match', 'current');
    }
  });
  if (scrollToFirst && first) {
    first.classList.add('current');
    setTimeout(() => first.classList.remove('current'), 1800);
  }
}

el.docSearch.addEventListener('input', e => runDocSearch(e.target.value.trim()));

/* ---------------------------------------------------------------------------
   Text to speech
   --------------------------------------------------------------------------- */
async function speakCurrentPage() {
  if (!('speechSynthesis' in window)) { toast('Read aloud not supported here', 'err'); return; }
  if (state.ttsActive) { stopTTS(); return; }
  const text = await getPageText(state.currentPage);
  if (!text) { toast('No readable text on this page', 'info'); return; }

  const u = new SpeechSynthesisUtterance(text.slice(0, 4000));
  u.rate = 1; u.pitch = 1;
  u.onend = () => {
    state.ttsActive = false;
    el.ttsBtn.classList.remove('active');
    el.ttsBtn.innerHTML = '<i class="fas fa-volume-high"></i>';
  };
  u.onerror = () => stopTTS();
  state.ttsUtterance = u;
  state.ttsActive = true;
  el.ttsBtn.classList.add('active');
  el.ttsBtn.innerHTML = '<i class="fas fa-volume-xmark"></i>';
  speechSynthesis.speak(u);
  toast('Reading page ' + state.currentPage + ' aloud', 'info', 1800);
}
function stopTTS() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  state.ttsActive = false;
  el.ttsBtn.classList.remove('active');
  el.ttsBtn.innerHTML = '<i class="fas fa-volume-high"></i>';
}
el.ttsBtn.addEventListener('click', speakCurrentPage);

/* ---------------------------------------------------------------------------
   Global keyboard
   --------------------------------------------------------------------------- */
window.addEventListener('keydown', e => {
  const reading = el.readerView.classList.contains('active');
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);

  if (e.key === 'Escape') {
    if (document.querySelector('.overlay.show')) {
      document.querySelector('.overlay.show').remove();
      return;
    }
    if (reading && !typing) closeReader();
    return;
  }

  if (!reading || typing) return;

  const pageStep = e.shiftKey ? 10 : 1;
  switch (e.key) {
    case 'ArrowRight': case 'PageDown':
      e.preventDefault(); scrollToPage(state.currentPage + pageStep, true); break;
    case 'ArrowLeft': case 'PageUp':
      e.preventDefault(); scrollToPage(state.currentPage - pageStep, true); break;
    case 'ArrowDown': e.preventDefault(); el.viewer.scrollBy({ top: 90 }); break;
    case 'ArrowUp':   e.preventDefault(); el.viewer.scrollBy({ top: -90 }); break;
    case 'Home': e.preventDefault(); scrollToPage(1, true); break;
    case 'End':  e.preventDefault(); scrollToPage(state.pageCount, true); break;
    case '+': case '=': e.preventDefault(); el.zoomIn.click(); break;
    case '-': case '_': e.preventDefault(); el.zoomOut.click(); break;
    case '0': e.preventDefault(); el.fitBtn.click(); break;
        case 'b': case 'B': e.preventDefault(); el.bookmarkBtn.click(); break;
    case 't': case 'T': e.preventDefault(); toggleSidebar(); break;
    case 'f': case 'F': e.preventDefault(); toggleFullscreen(); break;
        case 'p': case 'P': e.preventDefault(); setPenMode(!state.penMode); break;
    case 'm': case 'M': e.preventDefault(); setPinMode(!state.pinMode); break;
    case 'c': case 'C': e.preventDefault(); el.colorBtn.click(); break;
    case 'd': case 'D': e.preventDefault(); el.spreadBtn.click(); break;
    case 'i': case 'I': e.preventDefault(); el.immersiveBtn.click(); break;
    case 'g': case 'G': e.preventDefault(); el.pageInput.focus(); el.pageInput.select(); break;
    case 'k': case 'K': e.preventDefault(); el.appearanceBtn.click(); break;
    case '[': e.preventDefault(); el.zoomOut.click(); break;
    case ']': e.preventDefault(); el.zoomIn.click(); break;
    case ' ': e.preventDefault(); el.viewer.scrollBy({ top: el.viewer.clientHeight * 0.85, behavior: 'smooth' }); break;
  }

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
    e.preventDefault();
    el.searchBtn.click();
  }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    if (state.book) downloadBook(state.book);
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
    e.preventDefault();
    el.fileInput.click();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === '0') {
    e.preventDefault();
    state.zoom = 1; refreshVisible();
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) {
    e.preventDefault(); el.zoomIn.click();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === '-') {
    e.preventDefault(); el.zoomOut.click();
  }
});

/* ---------------------------------------------------------------------------
   ANNOTATION: PEN / DRAWING
   --------------------------------------------------------------------------- */
function setupDrawCanvas(pageEl, num) {
  let c = pageEl.querySelector('.draw-canvas');
  if (!c) {
    c = document.createElement('canvas');
    c.className = 'draw-canvas';
    c.dataset.page = num;
    pageEl.appendChild(c);
  }
  const w = pageEl.clientWidth || 700;
  const h = pageEl.clientHeight || Math.round(w * 4 / 3);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (c.width !== Math.floor(w * dpr) || c.height !== Math.floor(h * dpr)) {
    const prev = c.width && c.height ? c.toDataURL() : null;
    c.width = Math.floor(w * dpr);
    c.height = Math.floor(h * dpr);
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    if (prev) {
      const img = new Image();
      img.onload = () => {
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, c.width, c.height);
      };
      img.src = prev;
    }
  }
  c.classList.toggle('active', state.penMode && !state.pinMode);
  attachDrawListeners(pageEl, c, num);
  return c;
}

function attachDrawListeners(pageEl, canvas, num) {
  if (canvas.dataset.listeners === '1') return;
  canvas.dataset.listeners = '1';

  let stroke = null;
  const getPos = e => {
    const r = canvas.getBoundingClientRect();
    return {
      x: clamp((e.clientX - r.left) / r.width, 0, 1),
      y: clamp((e.clientY - r.top) / r.height, 0, 1),
    };
  };

  const down = e => {
    if (!state.penMode || state.pinMode) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    stroke = {
      id: uid(),
      page: num,
      color: state.penColor,
      size: state.penSize,
      points: [getPos(e)],
    };
    // single-point dot
    const ctx = canvas.getContext('2d');
    const dpr = canvas.width / canvas.clientWidth;
    ctx.fillStyle = stroke.color;
    ctx.beginPath();
    const p = stroke.points[0];
    ctx.arc(p.x * canvas.width, p.y * canvas.height, stroke.size * dpr / 2, 0, Math.PI * 2);
    ctx.fill();
  };

  const move = e => {
    if (!stroke) return;
    e.preventDefault();
    const p = getPos(e);
    const pts = stroke.points;
    const last = pts[pts.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) < 0.0015) return;
    pts.push(p);
    const ctx = canvas.getContext('2d');
    const dpr = canvas.width / canvas.clientWidth;
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = stroke.size * dpr;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(last.x * canvas.width, last.y * canvas.height);
    ctx.lineTo(p.x * canvas.width, p.y * canvas.height);
    ctx.stroke();
  };

  const up = () => {
    if (!stroke) return;
    state.book.drawings = state.book.drawings || [];
    state.book.drawings.push(stroke);
    Store.putBook(state.book);
    stroke = null;
  };

  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', up);
}

function redrawPageAnnotations(pageEl, num) {
  const canvas = pageEl.querySelector('.draw-canvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const strokes = (state.book?.drawings || []).filter(d => d.page === num);
    const dpr = canvas.width / Math.max(pageEl.clientWidth, 1);
    strokes.forEach(s => {
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.size * dpr;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (s.points.length === 1) {
        const p = s.points[0];
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(p.x * canvas.width, p.y * canvas.height, s.size * dpr / 2, 0, Math.PI * 2);
        ctx.fill();
        return;
      }
      ctx.beginPath();
      s.points.forEach((p, i) => {
        const x = p.x * canvas.width;
        const y = p.y * canvas.height;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    });
  }

  // re-render pins
  pageEl.querySelectorAll('.pin-marker').forEach(m => m.remove());
  const pins = (state.book?.pins || []).filter(p => p.page === num);
  pins.forEach(pin => {
    const m = document.createElement('div');
    m.className = 'pin-marker';
    m.style.left = (pin.x * 100) + '%';
    m.style.top = (pin.y * 100) + '%';
    m.dataset.pinId = pin.id;
    m.innerHTML = `
      <div class="pin-head" style="background:${pin.color || '#ff453a'}">
        <i class="fas fa-thumbtack"></i>
      </div>
      <div class="pin-tail"></div>`;
    if (pin.note) m.title = pin.note;
    m.addEventListener('click', e => {
      e.stopPropagation();
      openPinNote(pin.id);
    });
    pageEl.appendChild(m);
  });
}

function refreshAllDrawCanvases() {
  $$('.pdf-page', el.pages).forEach(node => {
    setupDrawCanvas(node, +node.dataset.page);
    redrawPageAnnotations(node, +node.dataset.page);
  });
}

/* ---------------------------------------------------------------------------
   PINS
   --------------------------------------------------------------------------- */
function attachPinListener(pageEl, num) {
  if (pageEl.dataset.pinAttached === '1') return;
  pageEl.dataset.pinAttached = '1';

  pageEl.addEventListener('click', e => {
    if (!state.pinMode) return;
    if (e.target.closest('.pin-marker')) return;
    if (e.target.closest('.draw-canvas.active')) return;
    const r = pageEl.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;
    if (x < 0 || x > 1 || y < 0 || y > 1) return;

    const pin = {
      id: uid(),
      page: num,
      x, y,
      note: '',
      color: state.penColor,
      createdAt: Date.now(),
    };
    state.book.pins = state.book.pins || [];
    state.book.pins.push(pin);
    Store.putBook(state.book);
    redrawPageAnnotations(pageEl, num);
    openPinNote(pin.id);
  });
}

function openPinNote(pinId) {
  const pin = (state.book?.pins || []).find(p => p.id === pinId);
  if (!pin) return;
  state.editingPinId = pinId;
  el.pinNoteText.value = pin.note || '';
  el.pinNotePopup.classList.add('show');

  const pageEl = el.pages.querySelector(`.pdf-page[data-page="${pin.page}"]`);
  if (pageEl) {
    const r = pageEl.getBoundingClientRect();
    const px = r.left + pin.x * r.width;
    const py = r.top + pin.y * r.height;
    const pw = el.pinNotePopup.offsetWidth || 250;
    const ph = el.pinNotePopup.offsetHeight || 160;
    let left = clamp(px - pw / 2, 10, innerWidth - pw - 10);
    let top = py + 22;
    if (top + ph > innerHeight - 10) top = py - ph - 30;
    el.pinNotePopup.style.left = left + 'px';
    el.pinNotePopup.style.top = Math.max(10, top) + 'px';
  }
  setTimeout(() => el.pinNoteText.focus(), 60);
}

el.pinNoteSave.addEventListener('click', async () => {
  const pin = (state.book?.pins || []).find(p => p.id === state.editingPinId);
  if (!pin) return;
  pin.note = el.pinNoteText.value.trim();
  await Store.putBook(state.book);
  el.pinNotePopup.classList.remove('show');
  const pageEl = el.pages.querySelector(`.pdf-page[data-page="${pin.page}"]`);
  if (pageEl) redrawPageAnnotations(pageEl, pin.page);
  toast('Pin saved', 'ok', 1400);
});
el.pinNoteCancel.addEventListener('click', () => {
  el.pinNotePopup.classList.remove('show');
  state.editingPinId = null;
});
el.pinNoteDelete.addEventListener('click', async () => {
  const id = state.editingPinId;
  state.book.pins = (state.book.pins || []).filter(p => p.id !== id);
  await Store.putBook(state.book);
  el.pinNotePopup.classList.remove('show');
  refreshAllDrawCanvases();
  toast('Pin removed', 'info', 1400);
  state.editingPinId = null;
});

/* ---------------------------------------------------------------------------
   APPEARANCE: brightness / contrast / page pattern / page color
   --------------------------------------------------------------------------- */
function applyPageAppearanceTo(node) {
  if (!node) return;
  const canvas = node.querySelector('canvas:not(.draw-canvas)');
  if (canvas) {
    canvas.style.filter =
      `brightness(${state.pageBrightness}%) contrast(${state.pageContrast}%)`;
  }
  const tint = node.querySelector('.page-tint');
  if (tint) {
    const showColor = state.pageBg && state.pageBg !== '#ffffff';
    let bg = showColor ? state.pageBg : '';
    if (state.pagePattern === 'lined') {
      const line = showColor ? 'rgba(120,120,120,.25)' : 'rgba(120,120,120,.35)';
      bg += (bg ? ',' : '') +
        `repeating-linear-gradient(transparent,transparent 31px,${line} 31px,${line} 32px)`;
    } else if (state.pagePattern === 'dotted') {
      const dot = showColor ? 'rgba(120,120,120,.25)' : 'rgba(120,120,120,.4)';
      bg += (bg ? ',' : '') + `radial-gradient(${dot} 1px,transparent 1px)`;
    }
    tint.style.background = bg;
    tint.style.backgroundSize =
      state.pagePattern === 'dotted' ? '16px 16px' : 'auto';
    tint.style.mixBlendMode = state.pagePattern === 'blank' && showColor
      ? 'multiply' : 'normal';
    tint.style.opacity = bg ? (state.pagePattern !== 'blank' ? '1' : '0.9') : '0';
  }
}

function applyPageAppearanceAll() {
  $$('.pdf-page', el.pages).forEach(applyPageAppearanceTo);
}

/* ---------------------------------------------------------------------------
   LAPTOP: Two-page spread
   --------------------------------------------------------------------------- */
function setSpread(on) {
  state.spreadMode = on;
  el.viewer.classList.toggle('spread', on);
  el.spreadBtn.classList.toggle('active', on);
  Store.setSetting('spreadMode', on);

  // Regrid: page order needs a shift so page 1 sits alone on the right
  // (book-style). We rebuild the DOM order so grid flows correctly.
  if (on) {
    el.pages.classList.add('spread-order');
    // Reset any custom ordering; instead use a CSS approach below.
  } else {
    el.pages.classList.remove('spread-order');
  }

  // force re-render of canvases at the new width
  setTimeout(() => {
    state.visiblePages.forEach(n => {
      const node = el.pages.querySelector(`.pdf-page[data-page="${n}"]`);
      if (!node) return;
      node.dataset.rendered = '';
      const c = node.querySelector('canvas:not(.draw-canvas)');
      if (c) { c.width = 0; c.height = 0; }
      node.querySelector('.textLayer').innerHTML = '';
      renderPageEl(node, true);
    });
    // rebuild annotations after resize
    setTimeout(() => refreshAllDrawCanvases(), 260);
  }, 60);

  toast(on ? 'Two-page spread on' : 'Single-page mode', 'info', 1400);
}

el.spreadBtn.addEventListener('click', () => setSpread(!state.spreadMode));

/* ---------------------------------------------------------------------------
   LAPTOP: Immersive / auto-hide toolbar
   --------------------------------------------------------------------------- */
function setImmersive(on) {
  state.immersive = on;
  el.immersiveBtn.classList.toggle('active', on);
  el.readerView.classList.toggle('immersive', on);
  Store.setSetting('immersive', on);
  if (!on) {
    el.readerBar.classList.remove('bar-hidden');
    document.querySelector('.reader-foot').classList.remove('bar-hidden');
    state.barHidden = false;
  } else {
    toast('Immersive mode — toolbar hides as you scroll', 'info', 2200);
  }
}

el.immersiveBtn.addEventListener('click', () => setImmersive(!state.immersive));

// auto-hide on scroll down, show on scroll up
let lastScrollY = 0;
el.viewer.addEventListener('scroll', () => {
  if (!state.immersive) return;
  const y = el.viewer.scrollTop;
  const foot = document.querySelector('.reader-foot');
  if (y > lastScrollY + 6 && y > 60 && !state.barHidden) {
    el.readerBar.classList.add('bar-hidden');
    foot.classList.add('bar-hidden');
    state.barHidden = true;
  } else if (y < lastScrollY - 6 && state.barHidden) {
    el.readerBar.classList.remove('bar-hidden');
    foot.classList.remove('bar-hidden');
    state.barHidden = false;
  }
  lastScrollY = y;
}, { passive: true });

// show toolbar when mouse moves near top
el.readerView.addEventListener('mousemove', e => {
  if (!state.immersive) return;
  const nearTop = e.clientY < 70;
  const nearBottom = e.clientY > window.innerHeight - 60;
  const foot = document.querySelector('.reader-foot');
  if (nearTop || nearBottom) {
    el.readerBar.classList.remove('bar-hidden');
    foot.classList.remove('bar-hidden');
    state.barHidden = false;
  }
});

/* ---------------------------------------------------------------------------
   LAPTOP: Trackpad pinch + Ctrl+wheel zoom
   --------------------------------------------------------------------------- */
const zoomHud = $('#zoomHud');
let zoomHudTimer = null;
function showZoomHud() {
  zoomHud.textContent = Math.round(state.zoom * 100) + '%';
  zoomHud.classList.add('show');
  clearTimeout(zoomHudTimer);
  zoomHudTimer = setTimeout(() => zoomHud.classList.remove('show'), 900);
}

el.viewer.addEventListener('wheel', e => {
  // trackpad pinch on Chrome fires wheel with ctrlKey=true
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0018);
    const next = clamp(state.zoom * factor, 0.35, 5);
    if (Math.abs(next - state.zoom) < 0.001) return;
    state.zoom = next;
    updatePageWidth();
    state.visiblePages.forEach(n => {
      const node = el.pages.querySelector(`.pdf-page[data-page="${n}"]`);
      if (node) {
        node.dataset.rendered = '';
        const c = node.querySelector('canvas:not(.draw-canvas)');
        if (c) { c.width = 0; c.height = 0; }
        node.querySelector('.textLayer').innerHTML = '';
        renderPageEl(node, true);
      }
    });
    showZoomHud();
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(() => {
      refreshAllDrawCanvases();
    }, 400);
  }
}, { passive: false });

/* ---------------------------------------------------------------------------
   LAPTOP: Mouse back / forward buttons
   --------------------------------------------------------------------------- */
window.addEventListener('mouseup', e => {
  if (e.button === 3 && el.readerView.classList.contains('active')) {
    // back button
    e.preventDefault();
    closeReader();
  }
  if (e.button === 4 && el.readerView.classList.contains('active')) {
    // forward button
    e.preventDefault();
    scrollToPage(state.currentPage + 1, true);
  }
});

/* ---------------------------------------------------------------------------
   LAPTOP: Prevent right-click menu on viewer pages (but allow on text)
   --------------------------------------------------------------------------- */
el.pages.addEventListener('contextmenu', e => {
  // allow text selection context menu on text layer
  if (e.target.closest('.textLayer')) return;
  // allow on annotations
  if (e.target.closest('.pin-marker')) return;
  e.preventDefault();
});

/* ---------------------------------------------------------------------------
   LAPTOP: Double-click a page to zoom toggle
   --------------------------------------------------------------------------- */
el.pages.addEventListener('dblclick', e => {
  if (state.penMode) return;
  if (e.target.closest('.textLayer')) return;
  if (e.target.closest('.pin-marker')) return;
  if (e.target.closest('canvas.draw-canvas')) return;
  const target = e.target.closest('.pdf-page');
  if (!target) return;
  if (state.zoom > 1.02) {
    state.zoom = 1;
  } else {
    state.zoom = 1.6;
  }
  updatePageWidth();
  state.visiblePages.forEach(n => {
    const node = el.pages.querySelector(`.pdf-page[data-page="${n}"]`);
    if (node) {
      node.dataset.rendered = '';
      const c = node.querySelector('canvas:not(.draw-canvas)');
      if (c) { c.width = 0; c.height = 0; }
      node.querySelector('.textLayer').innerHTML = '';
      renderPageEl(node, true);
    }
  });
  showZoomHud();
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(() => refreshAllDrawCanvases(), 400);
});

window.addEventListener('appinstalled', () => {
  installBanner.classList.remove('show');
  toast('Libre installed 🎉', 'ok');
});

/* ---------------------------------------------------------------------------
   PWA: standalone detection (adjust UI when running as app)
   --------------------------------------------------------------------------- */
if (window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true) {
  document.documentElement.classList.add('standalone');
}
/* ---------------------------------------------------------------------------
   Library UI events
   --------------------------------------------------------------------------- */
el.uploadBtnTop.addEventListener('click', () => el.fileInput.click());
el.fileInput.addEventListener('change', e => {
  if (e.target.files.length) importFiles(e.target.files);
  e.target.value = '';
});

el.libSearch.addEventListener('input', debounce(e => {
  state.filter = e.target.value;
  el.searchWrap.classList.toggle('has-value', !!e.target.value);
  renderLibrary();
}, 180));
el.searchClear.addEventListener('click', () => {
  el.libSearch.value = '';
  state.filter = '';
  el.searchWrap.classList.remove('has-value');
  renderLibrary();
});

el.sortSelect.addEventListener('change', e => {
  state.sort = e.target.value;
  Store.setSetting('sort', state.sort);
  renderLibrary();
});

$$('#viewSeg button').forEach(b => {
  b.addEventListener('click', () => {
    state.viewMode = b.dataset.view;
    $$('#viewSeg button').forEach(x => x.classList.toggle('active', x === b));
    Store.setSetting('view', state.viewMode);
    renderLibrary();
  });
});

window.addEventListener('beforeunload', () => { if (state.book) saveProgress(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state.book) saveProgress(); });

/* ---------------------------------------------------------------------------
   Boot
   --------------------------------------------------------------------------- */
async function boot() {
  await Store.init();

  // settings
  const savedTheme = await Store.getSetting('theme');
  setTheme(savedTheme || 'dark');
  const savedSort = await Store.getSetting('sort');
  if (savedSort) { state.sort = savedSort; el.sortSelect.value = savedSort; }
  const savedView = await Store.getSetting('view');
  if (savedView) {
    state.viewMode = savedView;
    $$('#viewSeg button').forEach(x => x.classList.toggle('active', x.dataset.view === savedView));
  }
  const nf = await Store.getSetting('nightFilter');
  if (nf) { state.nightInvert = true; document.documentElement.style.setProperty(
    '--page-filter', 'invert(1) hue-rotate(180deg) brightness(.92) contrast(.92)'); }
  // --- laptop / desktop prefs ---
  const sm = await Store.getSetting('spreadMode');
  if (sm) {
    state.spreadMode = true;
    el.viewer.classList.add('spread');
    el.spreadBtn.classList.add('active');
  }
  const im = await Store.getSetting('immersive');
  if (im) {
    state.immersive = true;
    el.immersiveBtn.classList.add('active');
    el.readerView.classList.add('immersive');
  }

  // --- desktop hint: show "Ctrl+scroll = zoom" tip once ---
  const hinted = await Store.getSetting('desktopHinted');
  if (!hinted && matchMedia('(pointer: fine)').matches) {
    setTimeout(() => {
      toast('Tip: Ctrl + scroll wheel to zoom · P for pen · M for pins · D for two‑page', 'info', 6200);
      Store.setSetting('desktopHinted', true);
    }, 3200);
  }
  // restore annotation / appearance settings
  const pb = await Store.getSetting('pageBrightness');
  if (pb) { state.pageBrightness = pb; el.brightnessSlider.value = pb; el.brightnessVal.textContent = pb + '%'; }
  const pc = await Store.getSetting('pageContrast');
  if (pc) { state.pageContrast = pc; el.contrastSlider.value = pc; el.contrastVal.textContent = pc + '%'; }
  const pp = await Store.getSetting('pagePattern');
  if (pp) {
    state.pagePattern = pp;
    $$('.pattern-btn', el.appearancePanel).forEach(b => b.classList.toggle('active', b.dataset.pattern === pp));
  }
  const pbg = await Store.getSetting('pageBg');
  if (pbg) {
    state.pageBg = pbg;
    $$('.page-bg-swatch', el.appearancePanel).forEach(s => s.classList.toggle('active', s.dataset.bg === pbg));
  }
  const psz = await Store.getSetting('penSize');
  if (psz) { state.penSize = psz; el.penSizeSlider.value = psz; el.penSizeVal.textContent = psz; }
  const pcl = await Store.getSetting('penColor');
  if (pcl) {
    state.penColor = pcl;
    $$('.color-swatch', el.colorPalette).forEach(s => s.classList.toggle('active', s.dataset.color === pcl));
  }

  state.books = (await Store.getAllBooks()) || [];
  renderLibrary();
  updateStoragePill();

  const welcomed = await Store.getSetting('welcomed');
  if (!welcomed) {
    setTimeout(showWelcomeModal, 500);
  } else {
    const persisted = await navigator.storage?.persisted?.().catch(() => false);
    if (!persisted) {
      // gently nudge once
      setTimeout(async () => {
        const nudge = await Store.getSetting('nudged');
        if (!nudge) {
          toast('Tip: allow persistent storage to protect your library.', 'info', 5000);
          Store.setSetting('nudged', true);
        }
      }, 4000);
    }
  }

  // recompute storage periodically
  setInterval(updateStoragePill, 20000);
}

boot().catch(err => {
  console.error(err);
  document.body.innerHTML =
    `<div style="display:grid;place-items:center;height:100vh;color:#f5f5f7;font-family:Inter;text-align:center;padding:30px">
      <div><h2 style="margin-bottom:12px">Unable to start Libre</h2>
      <p style="color:#a1a1ad">${escapeHtml(err.message || 'Unknown error')}</p></div>
    </div>`;
});

// Register service worker for offline / installable PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('Service worker registration failed', err);
    });
  });
}

// Chrome: capture "Open with → Libre" for .pdf files (File Handling API)
if ('launchQueue' in window) {
  launchQueue.setConsumer(async params => {
    if (!params.files || !params.files.length) return;
    const handles = params.files;
    const files = [];
    for (const h of handles) {
      try { files.push(await h.getFile()); } catch (e) {}
    }
    if (files.length) importFiles(files);
  });
}
})();
</script>
</body>
</html>
